<style>
  :root {
    --bg-main: #f1f5f9;
    --bg-card: #ffffff;
    --bg-subtle: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --primary: #1d4ed8;
    --primary-hover: #1e40af;
    --primary-light: #dbeafe;
    --teal: #0d9488;
    --teal-light: #ccfbf1;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --success: #15803d;
    --success-light: #dcfce7;
    --border: #e2e8f0;
    --radius-lg: 12px;
    --radius-md: 8px;
    --header-h: 56px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* KHOÁ CỨNG BỐ CỤC TRANG WEB (LOCKED VIEWPORT 100VH x 100VW) */
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: fixed;
    inset: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.5;
    font-size: 14.5px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* Loại bỏ độ trễ 300ms khi chạm trên thiết bị cảm ứng / trackpad */
  button, input, select, label, .nav-btn, .chip-btn, .btn, .drawer-item {
    touch-action: manipulation;
  }

  button, .nav-btn, .chip-btn, .btn, .drawer-item, .brand {
    user-select: none;
    -webkit-user-select: none;
  }

  button:active, .btn:active, .chip-btn:active, .nav-btn:active, .drawer-item:active {
    transform: translateY(1px);
  }

  /* Thanh điều hướng đỉnh khoá cố định (56px) */
  .top-header {
    height: var(--header-h);
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    z-index: 200;
    flex-shrink: 0;
  }

  .header-inner {
    height: 100%;
    max-width: 100%;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    min-width: 0;
  }

  .menu-trigger-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    height: 36px;
    padding: 0 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-weight: 700;
    font-size: 0.86rem;
    cursor: pointer;
  }

  .menu-trigger-btn:hover {
    background: var(--primary-light);
    color: var(--primary);
    border-color: #93c5fd;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-weight: 700;
    font-size: 1rem;
    color: var(--primary);
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
  }

  .brand-badge {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--primary);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.05rem;
    font-family: Georgia, serif;
  }

  .current-page-pill {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.7rem;
    border-radius: 99px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 0.8rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .nav-tabs {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-tabs::-webkit-scrollbar {
    display: none;
  }

  @media (max-width: 1120px) {
    .nav-tabs {
      display: none;
    }
  }

  .nav-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.38rem 0.68rem;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }

  .nav-btn:hover {
    background: var(--bg-main);
    color: var(--text-primary);
  }

  .nav-btn.active {
    background: var(--primary-light);
    color: var(--primary);
  }

  .header-utils {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .history-toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    color: var(--text-secondary);
    background: var(--bg-subtle);
    padding: 0.28rem 0.6rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }

  .history-toggle-label input {
    accent-color: var(--primary);
    width: 14px;
    height: 14px;
    cursor: pointer;
  }

  /* MENU ẨN DẠNG NGĂN KÉO TRƯỢT (OFF-CANVAS COLLAPSIBLE DRAWER) */
  .drawer-backdrop {
    position: fixed;
    inset: var(--header-h) 0 0 0;
    background: rgba(15, 23, 42, 0.35);
    z-index: 250;
    display: none;
  }

  .drawer-backdrop.open {
    display: block;
  }

  .sidebar-drawer {
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: 285px;
    max-width: 85vw;
    background: #ffffff;
    border-right: 1px solid var(--border);
    z-index: 300;
    transform: translateX(-102%);
    transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0.9rem 0.75rem;
    overflow-y: auto;
    box-shadow: 4px 0 20px rgba(15, 23, 42, 0.08);
  }

  .sidebar-drawer.open {
    transform: translateX(0);
  }

  .drawer-section-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 0.35rem 0.65rem;
    margin-bottom: 0.2rem;
  }

  .drawer-nav-list {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .drawer-item {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
  }

  .drawer-item:hover {
    background: var(--bg-main);
    color: var(--text-primary);
  }

  .drawer-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
  }

  .drawer-footer-box {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem;
    font-size: 0.78rem;
    color: var(--text-secondary);
  }

  /* KHUNG NỘI DUNG CHÍNH KHOÁ CỨNG CHIỀU CAO (CUỘN ĐỘC LẬP TỪNG TRANG) */
  .main-container {
    width: 100%;
    height: calc(100vh - var(--header-h));
    overflow: hidden;
    position: relative;
  }

  .page-section {
    display: none;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    padding: 1rem 1.25rem 2.5rem;
  }

  .page-section.active {
    display: block;
  }

  .page-section > * {
    max-width: 1240px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-banner {
    background: linear-gradient(135deg, #eff6ff 0%, #f0fdfa 100%);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .hero-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: 0.2rem;
  }

  .hero-subtitle {
    color: var(--text-secondary);
    font-size: 0.88rem;
    max-width: 720px;
  }

  .workspace-grid {
    display: grid;
    grid-template-columns: 350px minmax(0, 1fr);
    gap: 1rem;
    align-items: start;
  }

  @media (max-width: 920px) {
    .workspace-grid {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem;
  }

  .card-title {
    font-size: 0.96rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .form-group {
    margin-bottom: 0.75rem;
  }

  .form-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
  }

  .form-input, .form-select {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 0.9rem;
    color: var(--text-primary);
    background: #fff;
  }

  .form-input:focus, .form-select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.14);
  }

  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  .form-row-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
  }

  @media (max-width: 640px) {
    .form-row-3 {
      grid-template-columns: 1fr;
    }
  }

  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.35rem;
  }

  .chip-btn {
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 0.2rem 0.48rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .chip-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    padding: 0.52rem 0.85rem;
    border-radius: 7px;
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
  }

  .btn-secondary {
    background: var(--bg-subtle);
    color: var(--text-primary);
    border-color: var(--border);
  }

  .btn-secondary:hover {
    background: #e2e8f0;
  }

  .btn-outline {
    background: transparent;
    color: var(--primary);
    border-color: #93c5fd;
  }

  .btn-outline:hover {
    background: var(--primary-light);
  }

  .btn-danger {
    background: var(--danger-light);
    color: var(--danger);
    border-color: #fca5a5;
  }

  .btn-sm {
    padding: 0.34rem 0.65rem;
    font-size: 0.79rem;
  }

  .btn-block {
    width: 100%;
  }

  .status-banner {
    padding: 0.6rem 0.85rem;
    border-radius: 7px;
    font-size: 0.84rem;
    margin-bottom: 0.75rem;
    display: none;
  }

  .status-banner.error {
    display: block;
    background: var(--danger-light);
    color: #991b1b;
    border: 1px solid #fca5a5;
  }

  .status-banner.info {
    display: block;
    background: var(--primary-light);
    color: #1e3a8a;
    border: 1px solid #93c5fd;
  }

  .status-banner.success {
    display: block;
    background: var(--success-light);
    color: #166534;
    border: 1px solid #86efac;
  }

  .plot-container {
    width: 100%;
    height: 350px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #ffffff;
    overflow: hidden;
    position: relative;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  .kpi-grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.85rem;
    margin-bottom: 1rem;
  }

  @media (max-width: 960px) {
    .kpi-grid-4 {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 520px) {
    .kpi-grid-4 {
      grid-template-columns: 1fr;
    }
  }

  .metric-box {
    padding: 0.75rem 0.9rem;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
  }

  .metric-box.primary-accent {
    background: #eff6ff;
    border-color: #bfdbfe;
  }

  .metric-box.teal-accent {
    background: #f0fdfa;
    border-color: #99f6e4;
  }

  .metric-box.amber-accent {
    background: #fffbeb;
    border-color: #fde68a;
  }

  .metric-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .metric-value {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-top: 0.1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .metric-sub {
    font-size: 0.76rem;
    color: var(--text-muted);
    margin-top: 0.1rem;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 0.35rem;
  }

  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 99px;
  }

  .steps-list {
    list-style: none;
    counter-reset: step-counter;
    margin-top: 0.5rem;
  }

  .steps-list li {
    counter-increment: step-counter;
    position: relative;
    padding: 0.55rem 0.75rem 0.55rem 2.25rem;
    background: var(--bg-subtle);
    border-radius: 7px;
    margin-bottom: 0.4rem;
    font-size: 0.87rem;
  }

  .steps-list li::before {
    content: counter(step-counter);
    position: absolute;
    left: 0.6rem;
    top: 0.55rem;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 0.9rem;
  }

  .app-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.7rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.16rem 0.5rem;
    border-radius: 99px;
    font-size: 0.72rem;
    font-weight: 700;
  }

  .badge-blue { background: var(--primary-light); color: var(--primary); }
  .badge-teal { background: var(--teal-light); color: var(--teal); }
  .badge-amber { background: var(--amber-light); color: var(--amber); }

  .data-vs-calc {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.55rem;
    margin: 0.4rem 0;
  }

  @media (max-width: 640px) {
    .data-vs-calc {
      grid-template-columns: 1fr;
    }
  }

  .box-input-data {
    background: #f8fafc;
    border-left: 3px solid var(--primary);
    padding: 0.5rem 0.65rem;
    border-radius: 6px;
    font-size: 0.82rem;
  }

  .box-calc-result {
    background: #f0fdf4;
    border-left: 3px solid var(--success);
    padding: 0.5rem 0.65rem;
    border-radius: 6px;
    font-size: 0.82rem;
  }

  .app-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    padding-top: 0.45rem;
    border-top: 1px solid var(--border);
  }

  .interactive-panel {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin-top: 0.4rem;
    display: none;
  }

  .interactive-panel.open {
    display: block;
  }

  .table-responsive {
    overflow-x: auto;
  }

  .clean-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  .clean-table th, .clean-table td {
    padding: 0.55rem 0.65rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }

  .clean-table th {
    background: var(--bg-subtle);
    font-weight: 700;
    color: var(--text-secondary);
  }

  .footer-bar {
    margin-top: 1.75rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
  }
</style>
