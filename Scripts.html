  // ============================================================================
  // BỘ PHÂN TÍCH BIỂU THỨC CÓ CACHE VÀ TÍNH TÍCH PHÂN SỐ TỐC ĐỘ CAO
  // ============================================================================

  function compileSafeExpression(rawExpr) {
    if (!rawExpr || typeof rawExpr !== 'string') {
      return { ok: false, error: 'Vui lòng nhập biểu thức hàm số f(x).' };
    }
    var trimmed = rawExpr.trim();
    if (trimmed.length === 0) {
      return { ok: false, error: 'Biểu thức hàm số không được để trống.' };
    }
    if (trimmed.length > MAX_EXPR_LENGTH) {
      return { ok: false, error: 'Biểu thức quá dài (tối đa ' + MAX_EXPR_LENGTH + ' ký tự).' };
    }
    if (/[;{}]|function|window|document|eval|import|Constructor/i.test(trimmed)) {
      return { ok: false, error: 'Biểu thức chứa từ khóa không hợp lệ.' };
    }

    // Trả về ngay từ bộ nhớ đệm nếu biểu thức đã được biên dịch trước đó
    if (compiledCache[trimmed]) {
      return compiledCache[trimmed];
    }

    var cleanFastKey = trimmed.replace(/\s+/g, '');
    var FAST_MAP = {
      'x^2': function(x) { return x * x; },
      '2*x': function(x) { return 2 * x; },
      'x^2-4': function(x) { return x * x - 4; },
      'sin(x)': function(x) { return Math.sin(x); },
      'cos(x)': function(x) { return Math.cos(x); },
      'exp(-x)': function(x) { return Math.exp(-x); },
      'exp(-x^2)': function(x) { return Math.exp(-x * x); },
      'sqrt(x+1)': function(x) { return x >= -1 ? Math.sqrt(x + 1) : NaN; },
      '1/(x^2+1)': function(x) { return 1 / (x * x + 1); },
      '100+20*x': function(x) { return 100 + 20 * x; },
      '3+x': function(x) { return 3 + x; },
      '2*x+10': function(x) { return 2 * x + 10; },
      '2+0.5*x': function(x) { return 2 + 0.5 * x; },
      '15-2*x': function(x) { return 15 - 2 * x; },
      'x-2': function(x) { return x - 2; },
      '3*x^2-2*x+1': function(x) { return 3 * x * x - 2 * x + 1; },
      '6+2*x': function(x) { return 6 + 2 * x; },
      '10+3*x^2': function(x) { return 10 + 3 * x * x; }
    };
    if (FAST_MAP[cleanFastKey]) {
      var fastObj = {
        ok: true,
        raw: trimmed,
        normalized: trimmed,
        tex: trimmed,
        evalFn: FAST_MAP[cleanFastKey]
      };
      compiledCache[trimmed] = fastObj;
      return fastObj;
    }


    if (typeof math === 'undefined') {
      return { ok: false, error: 'Thư viện toán học Math.js đang tải, vui lòng thử lại sau giây lát.' };
    }

    var normalized = trimmed.replace(/\bln\s*\(/g, 'log(');

    try {
      var node = math.parse(normalized);
      var compiled = node.compile();

      // Sử dụng đối tượng sharedScope dùng chung để tránh cấp phát hàng nghìn Object trong vòng lặp
      var evaluateAt = function(val) {
        sharedScope.x = val;
        sharedScope.t = val;
        var res = compiled.evaluate(sharedScope);
        if (typeof res === 'number' && isFinite(res)) {
          return res;
        }
        return NaN;
      };

      evaluateAt(1.2345);

      var texStr = '';
      try {
        texStr = node.toTex({ parenthesis: 'keep' });
      } catch (texErr) {
        texStr = trimmed;
      }

      var resultObj = {
        ok: true,
        raw: trimmed,
        normalized: normalized,
        tex: texStr,
        evalFn: evaluateAt
      };
      compiledCache[trimmed] = resultObj;
      return resultObj;
    } catch (err) {
      return {
        ok: false,
        error: 'Biểu thức toán học không hợp lệ. Ví dụ cú pháp đúng: 2*x, x^2 - 4, sin(x), exp(-x), sqrt(x+1).'
      };
    }
  }

  function detectElementaryAntiderivative(expr, varName) {
    var v = varName || 'x';
    var clean = expr.replace(/\s+/g, '');
    var catalog = {
      '2*x': { latex: v + '^2', desc: 'Nguyên hàm của 2' + v + ' là F(' + v + ') = ' + v + '².' },
      'x^2': { latex: '\frac{' + v + '^3}{3}', desc: 'Nguyên hàm của ' + v + '² là F(' + v + ') = ' + v + '³/3.' },
      'x^2-4': { latex: '\frac{' + v + '^3}{3} - 4' + v, desc: 'Nguyên hàm của ' + v + '² - 4 là F(' + v + ') = ' + v + '³/3 - 4' + v + '.' },
      '100+20*x': { latex: '100' + v + ' + 10' + v + '^2', desc: 'Nguyên hàm của 100 + 20' + v + ' là F(' + v + ') = 100' + v + ' + 10' + v + '².' },
      '3+x': { latex: '3' + v + ' + 0.5' + v + '^2', desc: 'Nguyên hàm của 3 + ' + v + ' là F(' + v + ') = 3' + v + ' + 0.5' + v + '².' },
      '2*x+10': { latex: v + '^2 + 10' + v, desc: 'Nguyên hàm của 2' + v + ' + 10 là F(' + v + ') = ' + v + '² + 10' + v + '.' },
      '2+0.5*x': { latex: '2' + v + ' + 0.25' + v + '^2', desc: 'Nguyên hàm của 2 + 0.5' + v + ' là F(' + v + ') = 2' + v + ' + 0.25' + v + '².' },
      '15-2*x': { latex: '15' + v + ' - ' + v + '^2', desc: 'Nguyên hàm của 15 - 2' + v + ' là F(' + v + ') = 15' + v + ' - ' + v + '².' },
      'sin(x)': { latex: '-\cos(' + v + ')', desc: 'Nguyên hàm của sin(' + v + ') là F(' + v + ') = -cos(' + v + ').' },
      'cos(x)': { latex: '\sin(' + v + ')', desc: 'Nguyên hàm của cos(' + v + ') là F(' + v + ') = sin(' + v + ').' },
      'exp(x)': { latex: 'e^{' + v + '}', desc: 'Nguyên hàm của e^' + v + ' là F(' + v + ') = e^' + v + '.' },
      'exp(-x)': { latex: '-e^{-' + v + '}', desc: 'Nguyên hàm của e^(-' + v + ') là F(' + v + ') = -e^(-' + v + ').' }
    };
    return catalog[clean] || null;
  }

  function computeNumericalIntegral(evalFn, a, b, nIntervals) {
    var N = parseInt(nIntervals, 10);
    if (isNaN(N) || N < MIN_SUBINTERVALS) N = 160;
    if (N > MAX_SUBINTERVALS) N = MAX_SUBINTERVALS;
    if (N % 2 !== 0) N += 1;

    if (a === b) {
      return {
        ok: true,
        signedIntegral: 0,
        geometricArea: 0,
        positiveArea: 0,
        negativeArea: 0,
        nUsed: N,
        undefinedCount: 0
      };
    }

    var signFlip = 1;
    var low = a;
    var high = b;
    if (a > b) {
      signFlip = -1;
      low = b;
      high = a;
    }

    var h = (high - low) / N;
    var signedSum = 0;
    var absSum = 0;
    var posArea = 0;
    var negArea = 0;
    var undefinedPoints = 0;

    for (var i = 0; i < N; i++) {
      var x0 = low + i * h;
      var x1 = x0 + h;
      var xm = 0.5 * (x0 + x1);

      var y0 = evalFn(x0);
      var ym = evalFn(xm);
      var y1 = evalFn(x1);

      if (!isFinite(y0)) y0 = evalFn(x0 + h * 1e-5);
      if (!isFinite(y1)) y1 = evalFn(x1 - h * 1e-5);

      if (!isFinite(y0) || !isFinite(ym) || !isFinite(y1) ||
          Math.abs(y0) > Y_CLIP_LIMIT || Math.abs(ym) > Y_CLIP_LIMIT || Math.abs(y1) > Y_CLIP_LIMIT) {
        undefinedPoints++;
        continue;
      }

      var segSigned = (h / 6) * (y0 + 4 * ym + y1);
      var segAbs = (h / 6) * (Math.abs(y0) + 4 * Math.abs(ym) + Math.abs(y1));

      signedSum += segSigned;
      absSum += segAbs;
      if (segSigned >= 0) {
        posArea += segSigned;
      } else {
        negArea += Math.abs(segSigned);
      }
    }

    if (undefinedPoints > N * 0.25) {
      return {
        ok: false,
        error: 'Hàm số không xác định hoặc có tiệm cận đứng (phân kỳ) trên phần lớn đoạn [' + a + ', ' + b + ']. Vui lòng kiểm tra tập xác định.'
      };
    }

    return {
      ok: true,
      signedIntegral: signFlip * signedSum,
      geometricArea: absSum,
      positiveArea: posArea,
      negativeArea: negArea,
      nUsed: N,
      undefinedCount: undefinedPoints
    };
  }

  function generatePlotSamples(evalFn, a, b, mode, showAbs) {
    var xMin = -5;
    var xMax = 5;

    if (mode === 'definite' && isFinite(a) && isFinite(b)) {
      var low = Math.min(a, b);
      var high = Math.max(a, b);
      var span = Math.max(high - low, 2);
      xMin = low - span * 0.25;
      xMax = high + span * 0.25;
    } else if (isFinite(a) && !isFinite(b)) {
      xMin = a - 5;
      xMax = a + 5;
    } else if (!isFinite(a) && isFinite(b)) {
      xMin = b - 5;
      xMax = b + 5;
    }

    // Số điểm lấy mẫu tối ưu (160 điểm đường cong, 100 điểm tô miền) giúp đồ thị mượt mà không nặng SVG
    var sampleCount = 160;
    var step = (xMax - xMin) / sampleCount;
    var xCurve = [];
    var yCurve = [];
    var yMinVal = Infinity;
    var yMaxVal = -Infinity;

    for (var i = 0; i <= sampleCount; i++) {
      var x = xMin + i * step;
      var y = evalFn(x);
      if (isFinite(y) && Math.abs(y) <= 1e4) {
        var val = showAbs ? Math.abs(y) : y;
        xCurve.push(x);
        yCurve.push(val);
        if (val < yMinVal) yMinVal = val;
        if (val > yMaxVal) yMaxVal = val;
      } else {
        xCurve.push(x);
        yCurve.push(null);
      }
    }

    var xFillPos = [];
    var yFillPos = [];
    var xFillNeg = [];
    var yFillNeg = [];

    if (mode === 'definite' && isFinite(a) && isFinite(b)) {
      var fillLow = Math.min(a, b);
      var fillHigh = Math.max(a, b);
      var fillSteps = 100;
      var fillH = (fillHigh - fillLow) / fillSteps;

      for (var j = 0; j <= fillSteps; j++) {
        var xf = fillLow + j * fillH;
        var yf = evalFn(xf);
        if (!isFinite(yf) || Math.abs(yf) > 1e4) {
          xFillPos.push(xf); yFillPos.push(null);
          xFillNeg.push(xf); yFillNeg.push(null);
          continue;
        }
        if (showAbs) {
          xFillPos.push(xf);
          yFillPos.push(Math.abs(yf));
        } else {
          xFillPos.push(xf);
          yFillPos.push(yf >= 0 ? yf : 0);
          xFillNeg.push(xf);
          yFillNeg.push(yf < 0 ? yf : 0);
        }
      }
    }

    var fa = isFinite(a) ? evalFn(a) : null;
    var fb = isFinite(b) ? evalFn(b) : null;
    if (showAbs) {
      if (isFinite(fa)) fa = Math.abs(fa);
      if (isFinite(fb)) fb = Math.abs(fb);
    }

    return {
      xCurve: xCurve,
      yCurve: yCurve,
      xFillPos: xFillPos,
      yFillPos: yFillPos,
      xFillNeg: xFillNeg,
      yFillNeg: yFillNeg,
      xMin: xMin,
      xMax: xMax,
      yMinVal: yMinVal,
      yMaxVal: yMaxVal,
      fa: fa,
      fb: fb
    };
  }

  function formatNum(num, digits) {
    if (num === null || num === undefined || !isFinite(num)) return '—';
    var d = digits !== undefined ? digits : 4;
    var factor = Math.pow(10, d);
    var rounded = Math.round(num * factor) / factor;
    return rounded.toLocaleString('vi-VN', { maximumFractionDigits: d });
  }

  /**
   * Khoanh vùng biên dịch MathJax chỉ trong phần tử được chỉ định (không bao giờ quét toàn trang).
   */
  var mathJaxDebounce = null;
  function typesetMath(elements) {
    if (!elements) return;
    var targetList = Array.isArray(elements) ? elements.filter(Boolean) : [elements];
    if (targetList.length === 0) return;
    if (mathJaxDebounce) clearTimeout(mathJaxDebounce);
    mathJaxDebounce = setTimeout(function() {
      if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
        if (typeof window.MathJax.typesetClear === 'function') {
          window.MathJax.typesetClear(targetList);
        }
        window.MathJax.typesetPromise(targetList).catch(function() {});
      }
    }, 220);
  }

  // ============================================================================
  // XỬ LÝ MÁY TÍNH TÍCH PHÂN (TRANG CHỦ & TRANG MÁY TÍNH)
  // ============================================================================

  function runAnalysis(prefix) {
    var exprInput = document.getElementById(prefix + '-expr');
    var aInput = document.getElementById(prefix + '-a');
    var bInput = document.getElementById(prefix + '-b');
    var nInput = document.getElementById(prefix + '-n');
    var modeSelect = document.getElementById(prefix + '-mode');
    var absCheckbox = document.getElementById(prefix + '-abs');
    var statusEl = document.getElementById(prefix + '-status');

    if (!exprInput) return;

    var rawExpr = exprInput.value;
    var rawA = aInput ? aInput.value.trim() : '';
    var rawB = bInput ? bInput.value.trim() : '';
    var nVal = nInput ? parseInt(nInput.value, 10) : 160;
    var selectedMode = modeSelect ? modeSelect.value : 'definite';
    var showAbs = absCheckbox ? absCheckbox.checked : false;

    hideStatus(statusEl);

    var compiled = compileSafeExpression(rawExpr);
    if (!compiled.ok) {
      showStatus(statusEl, compiled.error, 'error');
      return;
    }

    var hasBothBounds = (rawA !== '' && rawB !== '' && !isNaN(Number(rawA)) && !isNaN(Number(rawB)));
    var a = hasBothBounds ? Number(rawA) : NaN;
    var b = hasBothBounds ? Number(rawB) : NaN;

    var effectiveMode = (selectedMode === 'explore' || !hasBothBounds) ? 'explore' : 'definite';

    if (selectedMode === 'definite' && !hasBothBounds) {
      showStatus(
        statusEl,
        'Bạn chưa nhập đủ hai cận a và b. Hệ thống chuyển sang chế độ "Khảo sát hàm số và xem đồ thị" (không hiển thị giá trị tích phân xác định).',
        'info'
      );
    }

    var plotData = generatePlotSamples(compiled.evalFn, a, b, effectiveMode, showAbs);

    var validPoints = plotData.yCurve.filter(function(v) { return v !== null && isFinite(v); }).length;
    if (validPoints === 0) {
      showStatus(statusEl, 'Hàm số không xác định trên miền khảo sát hiện tại. Vui lòng kiểm tra điều kiện xác định (ví dụ: mẫu số khác 0, biểu thức trong căn/log dương).', 'error');
      return;
    }

    IntegralGraph.renderFunctionPlot(prefix + '-plot', {
      xCurve: plotData.xCurve,
      yCurve: plotData.yCurve,
      xFillPos: plotData.xFillPos,
      yFillPos: plotData.yFillPos,
      xFillNeg: plotData.xFillNeg,
      yFillNeg: plotData.yFillNeg,
      a: a,
      b: b,
      fa: plotData.fa,
      fb: plotData.fb,
      mode: effectiveMode,
      showAbs: showAbs,
      exprText: compiled.raw,
      variable: 'x',
      title: effectiveMode === 'definite'
        ? ('Đồ thị y = ' + (showAbs ? '|' + compiled.raw + '|' : compiled.raw) + ' trên đoạn [' + a + ', ' + b + ']')
        : ('Khảo sát đồ thị hàm số y = ' + compiled.raw)
    });

    if (effectiveMode === 'explore') {
      renderExploreResult(prefix, compiled, plotData);
      return;
    }

    var calcResult = computeNumericalIntegral(compiled.evalFn, a, b, nVal);
    if (!calcResult.ok) {
      showStatus(statusEl, calcResult.error, 'error');
      return;
    }

    if (calcResult.undefinedCount > 0) {
      showStatus(
        statusEl,
        'Lưu ý: Phát hiện ' + calcResult.undefinedCount + ' điểm gần biên/điểm gián đoạn trên đoạn [' + a + ', ' + b + ']. Kết quả được xấp xỉ số qua các lân cận xác định.',
        'info'
      );
    }

    renderDefiniteResult(prefix, compiled, a, b, calcResult, showAbs);

    recordHistoryItem({
      actionType: 'CALCULATE',
      expression: compiled.raw,
      lowerBound: a,
      upperBound: b,
      signedIntegral: calcResult.signedIntegral,
      geometricArea: calcResult.geometricArea,
      note: 'Máy tính tích phân (' + prefix + ')'
    });
  }

  function renderExploreResult(prefix, compiled, plotData) {
    var signedEl = document.getElementById(prefix + '-res-signed');
    var areaEl = document.getElementById(prefix + '-res-area');
    var formulaEl = document.getElementById(prefix + '-res-formula');
    var meaningEl = document.getElementById(prefix + '-res-meaning');
    var stepsContainer = document.getElementById(prefix + '-steps-box');

    if (signedEl) signedEl.textContent = 'Chế độ khảo sát';
    if (areaEl) areaEl.textContent = '[' + formatNum(plotData.xMin, 2) + '; ' + formatNum(plotData.xMax, 2) + ']';
    if (formulaEl) {
      formulaEl.innerHTML = '$$y = f(x) = ' + compiled.tex + '$$';
    }
    var y0 = compiled.evalFn(0);
    if (meaningEl) {
      meaningEl.innerHTML =
        '<strong>Chế độ khảo sát hàm số:</strong> Bạn đang xem hình dáng đồ thị $y = ' + compiled.tex + '$ trên miền $[' +
        formatNum(plotData.xMin, 1) + ', ' + formatNum(plotData.xMax, 1) + ']$. ' +
        'Giá trị nhỏ nhất quan sát được $\approx ' + formatNum(plotData.yMinVal, 3) + '$, giá trị lớn nhất $\approx ' +
        formatNum(plotData.yMaxVal, 3) + '$' +
        (isFinite(y0) ? (', giao điểm với trục tung tại $(0; ' + formatNum(y0, 3) + ')$.') : '.') +
        ' Nhập đủ hai cận $a, b$ và chọn chế độ "Tích phân xác định" để tính diện tích và tích phân.';
    }
    if (stepsContainer) {
      stepsContainer.innerHTML =
        '<ul class="steps-list">' +
        '<li><strong>Hàm số khảo sát:</strong> $f(x) = ' + compiled.tex + '$.</li>' +
        '<li><strong>Trạng thái cận:</strong> Chưa áp dụng hai cận xác định — hệ thống không tự gán giá trị tích phân xác định.</li>' +
        '<li><strong>Hướng dẫn:</strong> Nhập cận dưới $a$, cận trên $b$ và chuyển sang chế độ <em>A. Tích phân xác định</em> để xem giải thích từng bước.</li>' +
        '</ul>';
    }
    typesetMath([formulaEl, meaningEl, stepsContainer]);
  }

  function renderDefiniteResult(prefix, compiled, a, b, calcResult, showAbs) {
    var signedEl = document.getElementById(prefix + '-res-signed');
    var areaEl = document.getElementById(prefix + '-res-area');
    var formulaEl = document.getElementById(prefix + '-res-formula');
    var meaningEl = document.getElementById(prefix + '-res-meaning');
    var stepsContainer = document.getElementById(prefix + '-steps-box');

    if (signedEl) signedEl.textContent = formatNum(calcResult.signedIntegral, 5);
    if (areaEl) areaEl.textContent = formatNum(calcResult.geometricArea, 5) + ' đvdt';

    if (formulaEl) {
      formulaEl.innerHTML =
        '$$I = \int_{' + a + '}^{' + b + '} \left(' + compiled.tex + '\right) dx \approx ' +
        formatNum(calcResult.signedIntegral, 4) +
        '\quad | \quad S = \int_{' + a + '}^{' + b + '} \left|' + compiled.tex + '\right| dx \approx ' +
        formatNum(calcResult.geometricArea, 4) + '$$';
    }

    var hasNegativePart = calcResult.negativeArea > 1e-5;
    if (meaningEl) {
      if (hasNegativePart) {
        meaningEl.innerHTML =
          '<strong>Phân biệt Tích phân có dấu và Diện tích hình học:</strong> Trên đoạn $[' + a + ', ' + b + ']$, ' +
          'phần đồ thị nằm phía trên trục hoành đóng góp <strong>+' + formatNum(calcResult.positiveArea, 4) + '</strong>, ' +
          'trong khi phần nằm phía dưới trục hoành đóng góp âm <strong>-' + formatNum(calcResult.negativeArea, 4) + '</strong>. ' +
          'Do đó tích phân xác định (tổng đại số có dấu) là <strong>' + formatNum(calcResult.signedIntegral, 4) + '</strong>, ' +
          'còn diện tích hình học phẳng thực tế $\int_{' + a + '}^{' + b + '} |f(x)|\,dx$ là <strong>' +
          formatNum(calcResult.geometricArea, 4) + ' đvdt</strong>.';
      } else {
        meaningEl.innerHTML =
          '<strong>Ý nghĩa hình học:</strong> Trên toàn đoạn $[' + a + ', ' + b + ']$, hàm số không âm ($f(x) \ge 0$) nên ' +
          'tích phân xác định trùng khít với diện tích hình phẳng giới hạn bởi đồ thị $y = f(x)$, trục hoành $Ox$ và hai đường thẳng $x = ' +
          a + ', x = ' + b + '$, bằng <strong>' + formatNum(calcResult.geometricArea, 4) + ' đvdt</strong>.';
      }
    }

    if (stepsContainer) {
      var elemAnti = detectElementaryAntiderivative(compiled.normalized, 'x');
      var methodHtml = '';
      var stepCalcHtml = '';

      if (elemAnti && !showAbs) {
        methodHtml = 'Giải tích (Công thức Newton–Leibniz kết hợp kiểm chứng số Simpson 1/3 với $N = ' + calcResult.nUsed + '$ khoảng chia).';
        stepCalcHtml =
          '<li><strong>Tìm nguyên hàm sơ cấp:</strong> ' + elemAnti.desc + ' Biểu thức nguyên hàm: $F(x) = ' + elemAnti.latex + '$.</li>' +
          '<li><strong>Thế cận Newton–Leibniz:</strong> $I = F(' + b + ') - F(' + a + ') = ' + formatNum(calcResult.signedIntegral, 5) + '$.</li>';
      } else {
        methodHtml = 'Phương pháp xấp xỉ số <strong>Composite Simpson 1/3</strong> với $N = ' + calcResult.nUsed + '$ khoảng chia đều (giá trị gần đúng).';
        stepCalcHtml =
          '<li><strong>Nhận xét nguyên hàm:</strong> Biểu thức thuộc dạng tổng quát hoặc không có nguyên hàm sơ cấp đơn giản. Hệ thống không tự bịa biến đổi đại số mà tính trực tiếp bằng phương pháp giải tích số.</li>' +
          '<li><strong>Chia nhỏ miền tích phân:</strong> Chia đoạn $[' + a + ', ' + b + ']$ thành $N = ' + calcResult.nUsed + '$ khoảng có bước nhảy $h = \frac{' + b + ' - (' + a + ')}{' + calcResult.nUsed + '} = ' + formatNum((b - a) / calcResult.nUsed, 5) + '$.</li>' +
          '<li><strong>Xấp xỉ parabol từng đoạn:</strong> Áp dụng công thức $\frac{h}{6}[f(x_i) + 4f(x_{m}) + f(x_{i+1})]$ trên từng đoạn con để hội tụ về kết quả.</li>';
      }

      stepsContainer.innerHTML =
        '<ul class="steps-list">' +
        '<li><strong>Hàm số đầu vào:</strong> $f(x) = ' + compiled.tex + '$ &nbsp;|&nbsp; <strong>Cận tích phân:</strong> $a = ' + a + ',\; b = ' + b + '$.</li>' +
        '<li><strong>Công thức tích phân:</strong> $I = \int_{' + a + '}^{' + b + '} \left(' + compiled.tex + '\right) dx$.</li>' +
        '<li><strong>Phương pháp tính:</strong> ' + methodHtml + '</li>' +
        stepCalcHtml +
        '<li><strong>Kết quả cuối cùng:</strong> Tích phân xác định có dấu $I \approx <strong>' + formatNum(calcResult.signedIntegral, 5) + '</strong>$; ' +
        'Diện tích hình học phẳng $S = \int_{' + a + '}^{' + b + '} |f(x)|\,dx \approx <strong>' + formatNum(calcResult.geometricArea, 5) + '</strong>$ (đơn vị diện tích).</li>' +
        '<li><strong>Ý nghĩa trong ngữ cảnh:</strong> Tích phân xác định biểu diễn độ biến thiên ròng (có xét dấu âm/dương), trong khi tích phân của $|f(x)|$ biểu diễn tổng diện tích hình học phẳng.</li>' +
        '</ul>';
    }

    typesetMath([formulaEl, meaningEl, stepsContainer]);
  }

  function renderApplicationSpotlightPlot(appId) {
    var apps = getApplicationsList();
    var target = null;
    for (var i = 0; i < apps.length; i++) {
      if (apps[i].id === appId) {
        target = apps[i];
        break;
      }
    }
    if (!target) target = apps[0];
    if (!target) return;

    state.activeApplicationId = target.id;
    var custom = state.customAppParams[target.id] || {
      expr: target.expr,
      a: target.a,
      b: target.b,
      initialValue: target.initialValue || 0
    };

    var compiled = compileSafeExpression(custom.expr);
    if (!compiled.ok) return;

    var a = Number(custom.a);
    var b = Number(custom.b);
    var res = computeNumericalIntegral(compiled.evalFn, a, b, 120);
    var plotSamples = generatePlotSamples(compiled.evalFn, a, b, 'definite', false);
    var v = target.variable || 't';
    var formulaDisplay = custom.expr.replace(/\bx\b/g, v);

    var titleEl = document.getElementById('app-spotlight-title');
    var summaryEl = document.getElementById('app-spotlight-summary');
    var totalVal = Number(custom.initialValue || 0) + (res.ok ? res.signedIntegral : 0);

    if (titleEl) {
      titleEl.textContent = 'Đồ thị mô hình: ' + target.title;
    }
    if (summaryEl) {
      summaryEl.innerHTML =
        'Hàm tốc độ/biên: <strong>' + formulaDisplay + '</strong> (' + (target.rateUnit || 'đv') + ') &nbsp;|&nbsp; ' +
        'Đoạn tính: <strong>[' + a + ', ' + b + ']</strong> (' + (target.timeUnit || 'đv') + ') &nbsp;|&nbsp; ' +
        'Kết quả: <strong>' + formatNum(totalVal, 4) + ' ' + target.unit + '</strong>';
    }

    IntegralGraph.renderFunctionPlot('app-spotlight-plot', {
      xCurve: plotSamples.xCurve,
      yCurve: plotSamples.yCurve,
      xFillPos: plotSamples.xFillPos,
      yFillPos: plotSamples.yFillPos,
      xFillNeg: plotSamples.xFillNeg,
      yFillNeg: plotSamples.yFillNeg,
      a: a,
      b: b,
      fa: plotSamples.fa,
      fb: plotSamples.fb,
      mode: 'definite',
      showAbs: false,
      exprText: formulaDisplay,
      variable: v,
      xLabel: 'Biến ' + v + (target.timeUnit ? ' (' + target.timeUnit + ')' : ''),
      yLabel: (target.rateUnit ? target.rateUnit : 'f(' + v + ')'),
      title: target.title + ' — Kết quả: ' + formatNum(totalVal, 4) + ' ' + target.unit
    });
  }

      ],

      ],

        { expr: '20 - 2*x', a: 0, b: 5, init: 0, expected: 75, prompt: '(Mô hình giả định) Tốc độ truyền chất r(t) = 20 - 2t (mg/giờ) trong 5 giờ. Tính tổng lượng chất được đưa vào hệ thống (mg).' },

  function saveDashboardExampleForm() {
    var titleEl = document.getElementById('dash-form-title');
    var catEl = document.getElementById('dash-form-category');
    var diffEl = document.getElementById('dash-form-difficulty');
    var exprEl = document.getElementById('dash-form-expr');
    var aEl = document.getElementById('dash-form-a');
    var bEl = document.getElementById('dash-form-b');
    var initEl = document.getElementById('dash-form-init');
    var unitEl = document.getElementById('dash-form-unit');
    var questionEl = document.getElementById('dash-form-question');
    var meaningEl = document.getElementById('dash-form-meaning');
    var statusEl = document.getElementById('dash-form-status');

    var title = titleEl ? titleEl.value.trim() : '';
    var expr = exprEl ? exprEl.value.trim() : '';
    var a = aEl ? Number(aEl.value) : 0;
    var b = bEl ? Number(bEl.value) : 1;
    var initVal = initEl ? Number(initEl.value || 0) : 0;

    if (!title || !expr || isNaN(a) || isNaN(b)) {
      showStatus(statusEl, 'Vui lòng nhập đầy đủ Tiêu đề, Biểu thức f(x) và hai cận a, b hợp lệ.', 'error');
      return;
    }

    var compiled = compileSafeExpression(expr);
    if (!compiled.ok) {
      showStatus(statusEl, compiled.error, 'error');
      return;
    }

    var calc = computeNumericalIntegral(compiled.evalFn, a, b, 140);
    if (!calc.ok) {
      showStatus(statusEl, calc.error, 'error');
      return;
    }

    var expectedTotal = initVal + calc.signedIntegral;
    var cat = catEl ? catEl.value : 'Giải tích';
    var isApp = (cat !== 'Giải tích' && cat !== 'Phương pháp số');

    var newItem = {
      id: state.editingExampleId || ('custom-' + new Date().getTime()),
      code: isApp ? 'U' : 'M',
      isApplication: isApp,
      title: title,
      category: cat,
      difficulty: diffEl ? diffEl.value : 'Trung bình',
      situation: questionEl && questionEl.value.trim() ? questionEl.value.trim() : 'Bài toán mô hình do người quản lý tạo trên Dashboard.',
      dataDesc: 'f(x) = ' + expr + ' trên đoạn [' + a + ', ' + b + '].',
      question: questionEl && questionEl.value.trim() ? questionEl.value.trim() : ('Tính giá trị tích phân của ' + expr + ' trên [' + a + ', ' + b + '].'),
      expr: expr,
      displayExpr: 'f(x) = ' + expr,
      variable: isApp ? 't' : 'x',
      a: a,
      b: b,
      initialValue: initVal,
      expectedResult: expectedTotal,
      unit: unitEl ? unitEl.value.trim() : 'đv',
      rateUnit: '',
      timeUnit: '',
      modelLatex: 'I = \int_{' + a + '}^{' + b + '} (' + expr + ') dx = ' + formatNum(expectedTotal, 4),
      antiderivativeLatex: '',
      meaning: meaningEl && meaningEl.value.trim() ? meaningEl.value.trim() : ('Kết quả tính tự động bằng phương pháp Simpson 1/3 đạt ' + formatNum(expectedTotal, 4) + '.'),
      steps: [
        'Thiết lập tích phân xác định của hàm f(x) = ' + expr + ' từ ' + a + ' đến ' + b + '.',
        'Tính giá trị tích phân bằng phương pháp số Simpson 1/3: ' + formatNum(calc.signedIntegral, 4) + '.',
        'Kết quả tổng cộng: ' + formatNum(expectedTotal, 4) + ' ' + (unitEl ? unitEl.value.trim() : '') + '.'
      ]
    };

    var updated = false;
    for (var i = 0; i < state.examples.length; i++) {
      if (state.examples[i].id === newItem.id) {
        state.examples[i] = newItem;
        updated = true;
        break;
      }
    }
    if (!updated) {
      state.examples.unshift(newItem);
    }

    state.editingExampleId = null;
    state.renderedTabs.library = false;
    state.renderedTabs.applications = false;
    renderHomeFeaturedApps();
    renderDashboardPage();

    showStatus(statusEl, 'Đã lưu bài toán "' + newItem.title + '" (Kết quả chuẩn: ' + formatNum(expectedTotal, 4) + ').', 'success');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function() {})
        .withFailureHandler(function() {})
        .saveCustomExample(newItem);
    }
  }

  }

  function triggerSetupDatabaseFromDashboard() {
    var statusEl = document.getElementById('dash-db-status');
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      showStatus(statusEl, 'Đang gửi yêu cầu khởi tạo trang tính Examples & LearningHistory...', 'info');
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.ok) {
            showStatus(statusEl, res.message + (res.spreadsheetUrl ? ' URL: ' + res.spreadsheetUrl : ''), 'success');
          } else {
            showStatus(statusEl, (res && res.message) || 'Không thể khởi tạo Google Sheets.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showStatus(statusEl, 'Lỗi kết nối Google Apps Script: ' + err, 'error');
        })
        .setupDatabase();
    } else {
      showStatus(
        statusEl,
        'Bạn đang chạy bản xem trước trực tiếp (Canvas). Khi triển khai trên Google Apps Script, nút này sẽ tự động tạo tệp Google Sheets Integral_Lab_Database.',
        'info'
      );
    }
  }

  function switchPage(pageId, forceRender) {
    toggleDrawer(false);
    var pillEl = document.getElementById('current-page-indicator');
    if (pillEl && PAGE_LABELS[pageId]) pillEl.textContent = PAGE_LABELS[pageId];
    var dBtns = document.querySelectorAll('.drawer-item');
    for (var d = 0; d < dBtns.length; d++) {
      dBtns[d].classList.toggle('active', dBtns[d].getAttribute('data-page') === pageId);
    }
    state.currentPage = pageId;
    var sections = document.querySelectorAll('.page-section');
    for (var i = 0; i < sections.length; i++) {
      sections[i].classList.toggle('active', sections[i].id === 'page-' + pageId);
    }
    var menuToggleBtn = document.getElementById('btn-toggle-menu');
    if (menuToggleBtn) menuToggleBtn.addEventListener('click', function() { toggleDrawer(); });
    var closeDrawerBtn = document.getElementById('btn-close-drawer');
    if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', function() { toggleDrawer(false); });
    var backdrop = document.getElementById('sidebar-backdrop');
    if (backdrop) backdrop.addEventListener('click', function() { toggleDrawer(false); });

    var engineToggleBtn = document.getElementById('btn-toggle-plot-engine');
    if (engineToggleBtn) {
      engineToggleBtn.addEventListener('click', function() {
        var isPlotly = IntegralGraph.getEngineMode() === 'plotly';
        IntegralGraph.setEngineMode(!isPlotly);
        this.textContent = !isPlotly ? 'Đồ thị: Plotly SVG' : 'Đồ thị: Siêu mượt 0ms';
      });
    }

    var dashSaveBtn = document.getElementById('btn-dash-save-example');
    if (dashSaveBtn) dashSaveBtn.addEventListener('click', saveDashboardExampleForm);
    var dashResetFormBtn = document.getElementById('btn-dash-reset-form');
    if (dashResetFormBtn) dashResetFormBtn.addEventListener('click', resetDashboardExampleForm);
    var dashExportCsvBtn = document.getElementById('btn-dash-export-csv');
    if (dashExportCsvBtn) dashExportCsvBtn.addEventListener('click', exportHistoryCsv);
    var dashClearHistBtn = document.getElementById('btn-dash-clear-history');
    if (dashClearHistBtn) {
      dashClearHistBtn.addEventListener('click', function() {
        state.localHistory = [];
        renderHistoryTable();
        renderDashboardPage();
      });
    }
    var dashSetupDbBtn = document.getElementById('btn-dash-setup-db');
    if (dashSetupDbBtn) dashSetupDbBtn.addEventListener('click', triggerSetupDatabaseFromDashboard);
    var dashHistFilter = document.getElementById('dash-history-filter');
    if (dashHistFilter) dashHistFilter.addEventListener('change', renderDashboardHistoryTable);

    var navBtns = document.querySelectorAll('.nav-btn, .drawer-item');
    for (var j = 0; j < navBtns.length; j++) {
      navBtns[j].classList.toggle('active', navBtns[j].getAttribute('data-page') === pageId);
    }

    var shouldRender = Boolean(forceRender) || !state.renderedTabs[pageId];
    state.renderedTabs[pageId] = true;

    if (pageId === 'home') {
      if (shouldRender) runAnalysis('home');
      else IntegralGraph.resizePlot('home-plot');
    } else if (pageId === 'calculator') {
      if (shouldRender) runAnalysis('calc');
      else IntegralGraph.resizePlot('calc-plot');
    } else if (pageId === 'applications') {
      if (shouldRender) renderApplicationsPage();
      else IntegralGraph.resizePlot('app-spotlight-plot');
    } else if (pageId === 'library') {
      if (shouldRender) renderLibraryPage();
    } else if (pageId === 'exercises') {
      if (shouldRender) renderExercisesPage();
    } else if (pageId === 'dashboard') {
      renderDashboardPage();
    }
  }

  function loadExampleIntoCalculator(exampleId) {
    var items = state.examples.length > 0 ? state.examples : FALLBACK_EXAMPLES;
    var target = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === exampleId) { target = items[i]; break; }
    }
    if (!target) return;

    document.getElementById('calc-expr').value = target.expr;
    document.getElementById('calc-a').value = target.a;
    document.getElementById('calc-b').value = target.b;
    document.getElementById('calc-mode').value = 'definite';
    switchPage('calculator', true);
  }

  // ============================================================================
  // GẮN SỰ KIỆN GIAO DIỆN & KHỞI TẠO NHANH
  // ============================================================================

  function bindEvents() {
    var menuToggleBtn = document.getElementById('btn-toggle-menu');
    if (menuToggleBtn) menuToggleBtn.addEventListener('click', function() { toggleDrawer(); });
    var closeDrawerBtn = document.getElementById('btn-close-drawer');
    if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', function() { toggleDrawer(false); });
    var backdrop = document.getElementById('sidebar-backdrop');
    if (backdrop) backdrop.addEventListener('click', function() { toggleDrawer(false); });

    var engineToggleBtn = document.getElementById('btn-toggle-plot-engine');
    if (engineToggleBtn) {
      engineToggleBtn.addEventListener('click', function() {
        var isPlotly = IntegralGraph.getEngineMode() === 'plotly';
        IntegralGraph.setEngineMode(!isPlotly);
        this.textContent = !isPlotly ? 'Đồ thị: Plotly SVG' : 'Đồ thị: Siêu mượt 0ms';
      });
    }

    var dashSaveBtn = document.getElementById('btn-dash-save-example');
    if (dashSaveBtn) dashSaveBtn.addEventListener('click', saveDashboardExampleForm);
    var dashResetFormBtn = document.getElementById('btn-dash-reset-form');
    if (dashResetFormBtn) dashResetFormBtn.addEventListener('click', resetDashboardExampleForm);
    var dashExportCsvBtn = document.getElementById('btn-dash-export-csv');
    if (dashExportCsvBtn) dashExportCsvBtn.addEventListener('click', exportHistoryCsv);
    var dashClearHistBtn = document.getElementById('btn-dash-clear-history');
    if (dashClearHistBtn) {
      dashClearHistBtn.addEventListener('click', function() {
        state.localHistory = [];
        renderHistoryTable();
        renderDashboardPage();
      });
    }
    var dashSetupDbBtn = document.getElementById('btn-dash-setup-db');
    if (dashSetupDbBtn) dashSetupDbBtn.addEventListener('click', triggerSetupDatabaseFromDashboard);
    var dashHistFilter = document.getElementById('dash-history-filter');
    if (dashHistFilter) dashHistFilter.addEventListener('change', renderDashboardHistoryTable);

    var navBtns = document.querySelectorAll('.nav-btn, .drawer-item');
    for (var i = 0; i < navBtns.length; i++) {
      navBtns[i].addEventListener('click', function() {
        var page = this.getAttribute('data-page');
        if (page) switchPage(page, false);
      });
    }

    var brandLink = document.getElementById('brand-home-link');
    if (brandLink) {
      brandLink.addEventListener('click', function() { switchPage('home', false); });
    }

    var consentCheckbox = document.getElementById('toggle-save-history');
    if (consentCheckbox) {
      consentCheckbox.addEventListener('change', function() {
        state.saveHistoryConsent = this.checked;
        var badge = document.getElementById('db-sync-badge');
        if (badge) {
          badge.textContent = this.checked ? 'Đang bật lưu Google Sheets' : 'Lưu lịch sử: Tắt';
        }
      });
    }

    var homeAnalyzeBtn = document.getElementById('btn-home-analyze');
    if (homeAnalyzeBtn) {
      homeAnalyzeBtn.addEventListener('click', function() { runAnalysis('home'); });
    }
    var homeResetBtn = document.getElementById('btn-home-reset');
    if (homeResetBtn) {
      homeResetBtn.addEventListener('click', function() {
        document.getElementById('home-expr').value = 'x^2';
        document.getElementById('home-a').value = '0';
        document.getElementById('home-b').value = '3';
        runAnalysis('home');
      });
    }
    var homeDownloadBtn = document.getElementById('btn-home-download');
    if (homeDownloadBtn) {
      homeDownloadBtn.addEventListener('click', function() {
        IntegralGraph.downloadPlotImage('home-plot', 'integral_lab_trang_chu');
      });
    }

    var calcAnalyzeBtn = document.getElementById('btn-calc-analyze');
    if (calcAnalyzeBtn) {
      calcAnalyzeBtn.addEventListener('click', function() { runAnalysis('calc'); });
    }
    var calcResetBtn = document.getElementById('btn-calc-reset');
    if (calcResetBtn) {
      calcResetBtn.addEventListener('click', function() {
        document.getElementById('calc-expr').value = '2*x';
        document.getElementById('calc-a').value = '0';
        document.getElementById('calc-b').value = '5';
        document.getElementById('calc-n').value = '200';
        document.getElementById('calc-mode').value = 'definite';
        document.getElementById('calc-abs').checked = false;
        runAnalysis('calc');
      });
    }
    var calcZoomResetBtn = document.getElementById('btn-calc-zoom-reset');
    if (calcZoomResetBtn) {
      calcZoomResetBtn.addEventListener('click', function() {
        IntegralGraph.resetPlotView('calc-plot');
      });
    }
    var calcDownloadBtn = document.getElementById('btn-calc-download');
    if (calcDownloadBtn) {
      calcDownloadBtn.addEventListener('click', function() {
        IntegralGraph.downloadPlotImage('calc-plot', 'integral_lab_may_tinh');
      });
    }

    document.body.addEventListener('click', function(ev) {
      var chip = ev.target.closest('.chip-btn');
      if (chip) {
        var targetPrefix = chip.getAttribute('data-target') || 'calc';
        var expr = chip.getAttribute('data-expr');
        var a = chip.getAttribute('data-a');
        var b = chip.getAttribute('data-b');
        if (expr) document.getElementById(targetPrefix + '-expr').value = expr;
        if (a !== null && a !== undefined) document.getElementById(targetPrefix + '-a').value = a;
        if (b !== null && b !== undefined) document.getElementById(targetPrefix + '-b').value = b;
        runAnalysis(targetPrefix);
        return;
      }

      var actionBtn = ev.target.closest('[data-action]');
      if (!actionBtn) return;

      var action = actionBtn.getAttribute('data-action');
      var id = actionBtn.getAttribute('data-id');

      if (action === 'open-app-detail') {
        state.activeApplicationId = id;
        switchPage('applications', true);
        var cardEl = document.getElementById('card-' + id);
        if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (action === 'load-to-calc') {
        loadExampleIntoCalculator(id);
      } else if (action === 'app-view-graph') {
        renderApplicationSpotlightPlot(id);
        var plotSpot = document.getElementById('app-spotlight-card');
        if (plotSpot) plotSpot.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else if (action === 'app-toggle-panel') {
        var panelType = actionBtn.getAttribute('data-panel');
        var panelEl = document.getElementById('panel-' + panelType + '-' + id);
        if (panelEl) {
          var isOpening = !panelEl.classList.contains('open');
          panelEl.classList.toggle('open');
          if (isOpening && panelType === 'steps') {
            typesetMath(panelEl);
          }
        }
      } else if (action === 'app-apply-custom') {
        var newExpr = document.getElementById('edit-expr-' + id).value;
        var newA = Number(document.getElementById('edit-a-' + id).value);
        var newB = Number(document.getElementById('edit-b-' + id).value);
        var newInit = Number(document.getElementById('edit-init-' + id).value || 0);
        state.customAppParams[id] = { expr: newExpr, a: newA, b: newB, initialValue: newInit };
        delete state.similarProblems[id];
        state.activeApplicationId = id;
        renderApplicationsPage();
      } else if (action === 'app-reset-custom') {
        delete state.customAppParams[id];
        delete state.similarProblems[id];
        state.activeApplicationId = id;
        renderApplicationsPage();
      } else if (action === 'app-generate-similar') {
        generateSimilarAppProblem(id);
      } else if (action === 'app-verify-answer') {
        verifyApplicationAnswer(id);
      } else if (action === 'view-lib-detail') {
        showLibraryDetail(id);
      } else if (action === 'close-lib-detail') {
        var box = document.getElementById('library-detail-box');
        if (box) box.style.display = 'none';
      } else if (action === 'ex-submit') {
        submitExerciseAnswer(id);
      } else if (action === 'ex-hint') {
        var hBox = document.getElementById('ex-hint-box-' + id);
        if (hBox) hBox.style.display = hBox.style.display === 'none' ? 'block' : 'none';
      } else if (action === 'dash-edit-example') {
        loadExampleIntoDashboardForm(id);
      } else if (action === 'dash-delete-example') {
        deleteDashboardExample(id);
      } else if (action === 'ex-plot-preview') {
        var exObj = null;
        for (var k = 0; k < PRACTICE_EXERCISES.length; k++) {
          if (PRACTICE_EXERCISES[k].id === id) { exObj = PRACTICE_EXERCISES[k]; break; }
        }
        if (exObj) {
          document.getElementById('calc-expr').value = exObj.expr;
          document.getElementById('calc-a').value = exObj.a;
          document.getElementById('calc-b').value = exObj.b;
          switchPage('calculator', true);
        }
      }
    });

    var libCat = document.getElementById('lib-filter-category');
    if (libCat) libCat.addEventListener('change', renderLibraryPage);

    var searchTimer = null;
    var libSearch = document.getElementById('lib-search-input');
    if (libSearch) {
      libSearch.addEventListener('input', function() {
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(renderLibraryPage, 120);
      });
    }

    var exLevelBtns = document.querySelectorAll('[data-ex-level]');
    for (var m = 0; m < exLevelBtns.length; m++) {
      exLevelBtns[m].addEventListener('click', function() {
        state.exerciseLevel = this.getAttribute('data-ex-level');
        for (var n = 0; n < exLevelBtns.length; n++) {
          exLevelBtns[n].classList.toggle('btn-primary', exLevelBtns[n] === this);
          exLevelBtns[n].classList.toggle('btn-secondary', exLevelBtns[n] !== this);
        }
        renderExercisesPage();
      });
    }
  }

  function verifyApplicationAnswer(appId) {
    var inputEl = document.getElementById('check-ans-' + appId);
    var fbEl = document.getElementById('check-feedback-' + appId);
    if (!inputEl || !fbEl) return;

    var rawVal = inputEl.value.trim();
    if (rawVal === '' || isNaN(Number(rawVal))) {
      fbEl.innerHTML = '<span style="color:var(--danger);font-weight:600;">Vui lòng nhập một số hợp lệ để kiểm tra.</span>';
      return;
    }
    var userVal = Number(rawVal);
    var similar = state.similarProblems[appId];
    var expected = 0;

    if (similar) {
      expected = similar.expected;
    } else {
      var apps = getApplicationsList();
      var app = null;
      for (var i = 0; i < apps.length; i++) {
        if (apps[i].id === appId) { app = apps[i]; break; }
      }
      if (!app) return;
      var custom = state.customAppParams[appId] || { expr: app.expr, a: app.a, b: app.b, initialValue: app.initialValue || 0 };
      var compiled = compileSafeExpression(custom.expr);
      if (compiled.ok) {
        var r = computeNumericalIntegral(compiled.evalFn, Number(custom.a), Number(custom.b), 120);
        expected = Number(custom.initialValue || 0) + (r.ok ? r.signedIntegral : 0);
      }
    }

    var diff = Math.abs(userVal - expected);
    if (diff <= 0.05) {
      fbEl.innerHTML = '<span style="color:var(--success);font-weight:700;">Chính xác! Đáp án chuẩn là ' + formatNum(expected, 4) + '.</span>';
    } else {
      fbEl.innerHTML = '<span style="color:var(--danger);font-weight:600;">Chưa khớp. Đáp án đúng của mô hình là ' + formatNum(expected, 4) + ' (chênh lệch ' + formatNum(diff, 4) + ').</span>';
    }
  }

  function submitExerciseAnswer(exId) {
    var inputEl = document.getElementById('ex-input-' + exId);
    if (!inputEl) return;
    var raw = inputEl.value.trim();
    if (raw === '' || isNaN(Number(raw))) {
      var fb = document.getElementById('ex-feedback-' + exId);
      if (fb) {
        fb.innerHTML = '<div class="status-banner error" style="display:block;">Vui lòng nhập đáp án dạng số trước khi nộp bài.</div>';
      }
      return;
    }

    var ex = null;
    for (var i = 0; i < PRACTICE_EXERCISES.length; i++) {
      if (PRACTICE_EXERCISES[i].id === exId) { ex = PRACTICE_EXERCISES[i]; break; }
    }
    if (!ex) return;

    var userNum = Number(raw);
    var isCorrect = Math.abs(userNum - ex.answer) <= ex.tolerance;
    state.exerciseSubmitted[exId] = {
      userVal: userNum,
      isCorrect: isCorrect
    };

    recordHistoryItem({
      actionType: 'EXERCISE',
      expression: ex.expr,
      lowerBound: ex.a,
      upperBound: ex.b,
      signedIntegral: ex.answer,
      geometricArea: Math.abs(ex.answer),
      note: ex.title + (isCorrect ? ' (Đúng)' : ' (Chưa đúng)')
    });

    var fbBox = document.getElementById('ex-feedback-' + exId);
    if (fbBox) {
      fbBox.innerHTML = renderExerciseFeedbackHtml(ex, state.exerciseSubmitted[exId]);
    }
  }

  function init() {
    state.examples = FALLBACK_EXAMPLES.slice();
    bindEvents();

    // Khi mới mở trang, chỉ kết xuất đúng Trang chủ đang hiển thị để tốc độ tải tức thì (< 50ms)
    renderHomeFeaturedApps();
    renderHistoryTable();
    state.renderedTabs.home = true;
    runAnalysis('home');

    // Tải đồng bộ dữ liệu từ Google Apps Script Backend nếu đang chạy trên GAS
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response && response.ok && response.items && response.items.length > 0) {
            state.examples = response.items;
            renderHomeFeaturedApps();
            if (state.renderedTabs.applications) renderApplicationsPage();
            if (state.renderedTabs.library) renderLibraryPage();
          }
        })
        .withFailureHandler(function() {})
        .getExamples();
    }
  }

  return {
    init: init,
    runAnalysis: runAnalysis,
    switchPage: switchPage
  };
})();

window.addEventListener('DOMContentLoaded', function() {
  IntegralApp.init();
});
</script>
